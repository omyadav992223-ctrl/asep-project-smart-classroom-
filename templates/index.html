<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Classroom AI — Research Dashboard</title>
  <meta name="description" content="Real-time biometric telemetry dashboard for classroom research." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

  <!-- ── Header ──────────────────────────────────────────── -->
  <header id="app-header">
    <div class="header-title">
      <h1>SMART CLASSROOM AI // BIOMETRIC TELEMETRY</h1>
    </div>
  </header>

  <!-- ── Main Layout: Bento Grid ──────────────────────────── -->
  <main id="bento-grid">

    <!-- Tile A: Webcam Feed (Top-Left 40%) -->
    <div class="bento-card" id="tile-camera">
      <div class="card-header">LIVE FEED <span id="val-fps" class="small-mono">— FPS</span></div>
      <div id="video-wrapper">
        <img id="video-stream" src="/video_feed" alt="Live webcam feed" draggable="false" />
      </div>
    </div>

    <!-- Tile B: Focus Telemetry Chart (Top-Right 60%) -->
    <div class="bento-card" id="tile-chart">
      <div class="card-header">FOCUS TELEMETRY <span id="val-score" class="small-mono">0%</span></div>
      <div id="chart-wrapper">
        <canvas id="focus-chart" aria-label="Real-time focus score area chart"></canvas>
      </div>
    </div>

    <!-- Bottom Row: 4 Smaller Cards -->
    <div id="bottom-row">
      <!-- Card 1: Blink Rate & Settings -->
      <div class="bento-card small-card" id="card-blink">
        <div class="card-header">
          BLINK RATE (EAR)
          <div class="gear-menu">
            <button id="btn-gear" aria-label="Settings">⚙️</button>
            <div id="dropdown-menu" class="dropdown-content hidden">
              <button id="btn-report">📋 Report</button>
              <button id="btn-export">⬇ CSV</button>
              <button id="btn-export-r">⬇ JSON</button>
              <hr>
              <button id="btn-reset" class="danger">↺ Reset</button>
            </div>
          </div>
        </div>
        <div class="card-value-wrap">
          <span class="live-value" id="val-ear">—</span>
        </div>
      </div>

      <!-- Card 2: Emotion -->
      <div class="bento-card small-card" id="card-emotion">
        <div class="card-header">EMOTION</div>
        <div class="card-value-wrap">
          <span class="live-value" id="val-emotion">—</span>
        </div>
      </div>

      <!-- Card 3: Gaze Direction -->
      <div class="bento-card small-card" id="card-gaze">
        <div class="card-header">GAZE DIRECTION</div>
        <div class="card-value-wrap">
          <span class="live-value" id="val-gaze">—</span>
        </div>
      </div>

      <!-- Card 4: Boredom Bar -->
      <div class="bento-card small-card" id="card-boredom">
        <div class="card-header">BOREDOM LEVEL</div>
        <div class="card-value-wrap" style="flex-direction: column; align-items: stretch; justify-content: center; gap: 8px; width: 100%;">
          <div style="text-align: center;"><span class="live-value" id="val-boredom">0%</span></div>
          <div id="boredom-bar-wrapper">
            <div id="boredom-bar-fill"></div>
          </div>
        </div>
      </div>
    </div>

  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <!-- ── Report Modal ──────────────────────────────────────── -->
  <div id="report-modal" class="modal-backdrop hidden" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-label="Session Report">
      <div class="modal-header">
        <span>📋 Session Analysis Report</span>
        <button id="modal-close" class="btn btn-ghost">✕</button>
      </div>
      <div id="modal-body" class="modal-body">
        <p class="modal-loading">Loading report…</p>
      </div>
    </div>
  </div>

  <script src="/static/js/script.js"></script>
</body>
</html>
